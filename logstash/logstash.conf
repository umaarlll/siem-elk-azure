input {
  file {
    path => "/logs/elk-dataset-1.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["dataset1"]
  }
  file {
    path => "/logs/elk-dataset-2.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["dataset2"]
  }
}

filter {
  if "dataset1" in [tags] {
    csv {
      separator => ","
      columns => [
        "Device Time","Source IP Address","Source Port",
        "Source Protocol","Source Geolocation Country",
        "Source Geolocation City","Source Geolocation Latitude","Source Geolocation Longitude",
        "Source Organization","Event Type","Event Severity",
        "Destination IP Address","Destination Port",
        "Destination Protocol","Destination Geolocation Country",
        "Destination Geolocation City","Destination Geolocation Latitude","Destination Geolocation Longitude",
        "Destination Organization","Details"
      ]
    }
    date {
      match => [ "Device Time", "MMM dd, yyyy @ HH:mm:ss.SSS" ]
      target => "@timestamp"
    }
    geoip {
      source => "Source IP Address"
      target => "geoip"
    }
    mutate {
      convert => {
        "Source Geolocation Latitude"      => "float"
        "Source Geolocation Longitude"     => "float"
        "Destination Geolocation Latitude" => "float"
        "Destination Geolocation Longitude" => "float"
        "Source Port"                      => "integer"
        "Destination Port"                 => "integer"
      }
      add_field => {
        "[source_geo][lat]" => "%{Source Geolocation Latitude}"
        "[source_geo][lon]" => "%{Source Geolocation Longitude}"
        "[dest_geo][lat]"   => "%{Destination Geolocation Latitude}"
        "[dest_geo][lon]"   => "%{Destination Geolocation Longitude}"
      }
    }
    mutate {
      convert => {
        "[source_geo][lat]" => "float"
        "[source_geo][lon]" => "float"
        "[dest_geo][lat]"   => "float"
        "[dest_geo][lon]"   => "float"
      }
      remove_field => [
        "Source Geolocation Latitude","Source Geolocation Longitude",
        "Destination Geolocation Latitude","Destination Geolocation Longitude"
      ]
    }
    mutate {
      copy => { "source_geo" => "real_threat_location" }
    }
    if [Source IP Address] == "Source IP Address" { drop {} }
  }

  if "dataset2" in [tags] {
    csv {
      separator => ","
      columns => [
        "timestamp","source_ip","destination_ip",
        "source_country","service","destination_port",
        "protocol","action"
      ]
    }
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    mutate {
      convert => { "destination_port" => "integer" }
    }
    if [source_ip] == "source_ip" { drop {} }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "siem-logs-%{+YYYY.MM.dd}"
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
  }
  stdout { codec => rubydebug }
}
